name: Automated Kaggle Ingestion Pipeline

on:
  workflow_dispatch: # This allows Sir Marcel to trigger the script manually via a button on GitHub

jobs:
  run-ingestion:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Ingestion Script
        env:
          KAGGLE_BEARER_TOKEN: ${{ secrets.KAGGLE_BEARER_TOKEN }}
        run: python scripts/ingest.py

      - name: 💾 Upload Raw Data Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-dataset-archive
          path: data/raw/
